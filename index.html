<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spritesheet Builder</title>

    <style>
        :root {
            --bg: #0f1115;
            --panel: #1a1d23;
            --border: #2a2f3a;
            --accent: #4fc3f7;
            --text: #e4e7ec;
            --muted: #8a93a5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body.dragover {
            outline: 3px dashed var(--accent);
            outline-offset: -10px;
        }

        h1 {
            text-align: center;
            padding: 20px 0 10px;
            font-weight: 500;
            color: var(--accent);
        }

        .container {
            width: 95%;
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            padding-bottom: 30px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .dropzone.dragover {
            border-color: var(--accent);
            background: #161a22;
        }

        input[type="number"] {
            width: 100%;
            background: #13161c;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
        }

        input[type="number"]:focus {
            border-color: var(--accent);
        }

        input[type="checkbox"] {
            margin-right: 6px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            background: var(--accent);
            color: #000;
        }

        button.secondary {
            background: #2c3444;
            color: var(--text);
        }

        .file-list {
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            font-size: 0.8rem;
        }

        .file-item {
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: #13161c;
            cursor: grab;
        }

        .file-item.dragging {
            opacity: 0.4;
        }

        .output-info {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .preview-wrapper {
            overflow: auto;
            max-height: 75vh;
            border-radius: 12px;
            background:
                linear-gradient(45deg, #3a3a3a 25%, transparent 25%) 0 0,
                linear-gradient(-45deg, #3a3a3a 25%, transparent 25%) 0 0,
                linear-gradient(45deg, transparent 75%, #3a3a3a 75%) 0 0,
                linear-gradient(-45deg, transparent 75%, #3a3a3a 75%) 0 0;
            background-size: 20px 20px;
            background-position:
                0 0,
                0 10px,
                10px -10px,
                -10px 0px;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .collapsible {
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .collapsible-header {
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            padding: 6px 4px;
            transition: 0.2s;
        }

        .collapsible-header:hover {
            color: var(--text);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease;
        }

        .collapsible.open .collapsible-content {
            max-height: 220px;
        }

        .file-list {
            margin-top: 8px;
            overflow-y: auto;
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <meta name="google-site-verification" content="ef_xhcQhZ-1BV099-3l_uNjeQDNRM1Nz0DddtFoOb9k" />
</head>

<body>

    <h1>Spritesheet Builder</h1>

    <div class="container">
        <div class="panel">

            <div class="dropzone" id="dropzone">
                Drag & Drop Images<br>or Click to Select
                <input type="file" id="fileInput" multiple accept="image/*" hidden>
            </div>

            <div class="collapsible">
                <div class="collapsible-header" id="toggleFileList">
                    File Order ▼
                </div>
                <div class="collapsible-content" id="fileListWrapper">
                    <div class="file-list" id="fileList"></div>
                </div>
            </div>
            <label>Columns (0 = Auto)</label>
            <input type="number" id="cols" value="0" min="0">

            <label>Rows (0 = Auto)</label>
            <input type="number" id="rows" value="0" min="0">

            <label>Spacing (px)</label>
            <input type="number" id="spacing" value="0" min="0">

            <label>Output Scale</label>
            <input type="number" id="scale" value="1" step="0.1" min="0.1">

            <div class="output-info" id="outputInfo">Output Size: -</div>

            <label><input type="checkbox" id="reverse"> Reverse Order</label>
            <label><input type="checkbox" id="columnMajor"> Column Major Layout</label>

            <button onclick="generateSpritesheet()">Generate</button>
            <button class="secondary" onclick="downloadSheet()">Download PNG</button>




        </div>

        <div class="panel preview-wrapper">
            <canvas id="previewCanvas"></canvas>
        </div>
    </div>

    <script>
        let loadedImages = [];
        let lastCanvas = null;

        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const fileList = document.getElementById("fileList");

        const toggleFileList = document.getElementById("toggleFileList");
        const fileListWrapper = document.getElementById("fileListWrapper");
        const collapsible = toggleFileList.parentElement;

        toggleFileList.onclick = () => {
            collapsible.classList.toggle("open");

            toggleFileList.textContent = collapsible.classList.contains("open")
                ? "File Order ▲"
                : "File Order ▼";
        };
        // Prevent browser default behavior globally
        window.addEventListener("dragover", e => {
            e.preventDefault();
        });

        window.addEventListener("drop", e => {
            e.preventDefault();
        });

        // Visual feedback on whole page
        window.addEventListener("dragenter", e => {
            if (e.dataTransfer.types.includes("Files")) {
                document.body.classList.add("dragover");
            }
        });

        window.addEventListener("dragleave", e => {
            if (e.target === document.documentElement) {
                document.body.classList.remove("dragover");
            }
        });

        window.addEventListener("drop", e => {
            document.body.classList.remove("dragover");

            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });
        dropzone.onclick = () => fileInput.click();


        fileInput.onchange = () => handleFiles(fileInput.files);

        function handleFiles(files) {
            loadedImages = [];
            fileList.innerHTML = "";

            const sorted = sortFilesByNumber(Array.from(files));
            let loaded = 0;

            sorted.forEach(file => {
                const img = new Image();
                img.onload = () => {
                    loadedImages.push({ img, name: file.name });
                    loaded++;
                    if (loaded === sorted.length) {
                        renderFileList();
                        generateSpritesheet();
                    }
                };
                img.src = URL.createObjectURL(file);
            });
        }

        function sortFilesByNumber(files) {
            return files.sort((a, b) => {
                const parsedA = parseFilename(a.name);
                const parsedB = parseFilename(b.name);

                // If both have numbers → sort numerically, then by leading zeros (longer = higher priority)
                if (parsedA.number !== null && parsedB.number !== null) {
                    if (parsedA.number !== parsedB.number) {
                        return parsedA.number - parsedB.number;
                    }
                    // If numbers are equal, prefer the one with more leading zeros (longer numeric string)
                    if (parsedA.raw && parsedB.raw && parsedA.raw.length !== parsedB.raw.length) {
                        return parsedB.raw.length - parsedA.raw.length;
                    }
                }

                // Fallback alphabetical
                return a.name.localeCompare(b.name, undefined, { numeric: true });
            });
        }

        function parseFilename(name) {
            const nameWithoutExt = name.replace(/\.[^/.]+$/, "");
            const matches = [...nameWithoutExt.matchAll(/(\d+)/g)];
            if (!matches.length) {
                return { number: null };
            }
            // Heuristic: prefer the longest numeric substring (handles 0001 vs 01 etc)
            let best = matches[0];
            for (const m of matches) {
                if (m[0].length > best[0].length) best = m;
            }
            return {
                number: parseInt(best[0], 10),
                raw: best[0]
            };
        }

        function renderFileList() {
            fileList.innerHTML = "";
            loadedImages.forEach((entry, index) => {
                const div = document.createElement("div");
                div.className = "file-item";
                div.textContent = entry.name;
                div.draggable = true;

                div.ondragstart = () => div.classList.add("dragging");
                div.ondragend = () => {
                    div.classList.remove("dragging");
                    const items = [...fileList.children];
                    loadedImages = items.map(item =>
                        loadedImages.find(e => e.name === item.textContent)
                    );
                    generateSpritesheet();
                };

                div.ondragover = e => {
                    e.preventDefault();
                    const dragging = document.querySelector(".dragging");
                    if (dragging && dragging !== div) {
                        fileList.insertBefore(dragging, div);
                    }
                };

                fileList.appendChild(div);
            });
        }

        function autoGrid(count) {
            const cols = Math.ceil(Math.sqrt(count));
            const rows = Math.ceil(count / cols);
            return { cols, rows };
        }

        function generateSpritesheet() {
            if (!loadedImages.length) return;

            let cols = +colsInput.value;
            let rows = +rowsInput.value;
            const spacing = +spacingInput.value;
            const scale = +scaleInput.value;
            const reverse = reverseCheckbox.checked;
            const columnMajor = columnMajorCheckbox.checked;

            let images = [...loadedImages];
            if (reverse) images.reverse();

            if (cols === 0 && rows === 0) {
                const auto = autoGrid(images.length);
                cols = auto.cols;
                rows = auto.rows;
            } else if (cols === 0) {
                cols = Math.ceil(images.length / rows);
            } else if (rows === 0) {
                rows = Math.ceil(images.length / cols);
            }

            const spriteW = images[0].img.width;
            const spriteH = images[0].img.height;

            const sheetW = cols * spriteW + (cols - 1) * spacing;
            const sheetH = rows * spriteH + (rows - 1) * spacing;

            const canvas = previewCanvas;
            canvas.width = sheetW * scale;
            canvas.height = sheetH * scale;

            const ctx = canvas.getContext("2d");
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
            ctx.clearRect(0, 0, sheetW, sheetH);

            images.forEach((entry, i) => {
                let col, row;

                if (columnMajor) {
                    row = i % rows;
                    col = Math.floor(i / rows);
                } else {
                    col = i % cols;
                    row = Math.floor(i / cols);
                }

                if (col >= cols || row >= rows) return;

                const x = col * (spriteW + spacing);
                const y = row * (spriteH + spacing);

                ctx.drawImage(entry.img, x, y);
            });

            outputInfo.textContent =
                `Output Size: ${canvas.width} x ${canvas.height} px`;

            lastCanvas = canvas;
        }

        function downloadSheet() {
            if (!lastCanvas) return;
            const link = document.createElement("a");
            link.download = "spritesheet.png";
            link.href = lastCanvas.toDataURL("image/png");
            link.click();
        }

        const colsInput = document.getElementById("cols");
        const rowsInput = document.getElementById("rows");
        const spacingInput = document.getElementById("spacing");
        const scaleInput = document.getElementById("scale");
        const reverseCheckbox = document.getElementById("reverse");
        const columnMajorCheckbox = document.getElementById("columnMajor");
        const previewCanvas = document.getElementById("previewCanvas");
        const outputInfo = document.getElementById("outputInfo");

    </script>
</body>

</html>
